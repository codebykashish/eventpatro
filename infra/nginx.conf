# Eventpatro — Nginx Configuration for Ubuntu EC2
# Place this at /etc/nginx/sites-available/eventpatro and symlink to /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Maximum upload size for event cover photos and profile pictures
    client_max_body_size 15M;

    # 1. Frontend — Serve compiled React Vite files
    root /var/www/eventpatro/client/dist;
    index index.html;

    # Handle client-side routing (React Router fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Backend API Reverse Proxy — Forward /api requests to Express on port 5000
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 3. Static Uploads Reverse Proxy (if local uploads fallback is used)
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Cache static assets for improved performance
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
