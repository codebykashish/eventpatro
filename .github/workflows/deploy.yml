name: Deploy Eventpatro to Ubuntu EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: 3. Install Server Dependencies
        run: |
          cd server
          npm ci --omit=dev

      - name: 4. Build Client (React + Vite)
        env:
          VITE_API_URL: /api
        run: |
          cd client
          npm ci
          npm run build

      - name: 5. Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            echo ">>> [1/5] Pulling latest code..."
            cd /var/www/eventpatro
            git fetch origin main
            git reset --hard origin/main

            echo ">>> [2/5] Installing server dependencies..."
            cd /var/www/eventpatro/server
            npm ci --omit=dev

            echo ">>> [3/5] Updating server .env file..."
            cat << 'EOF' > .env
            PORT=5000
            NODE_ENV=production
            CLIENT_URL=${{ secrets.CLIENT_URL || 'http://localhost' }}
            MONGODB_URI=${{ secrets.MONGODB_URI }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN=7d
            SMTP_HOST=${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
            SMTP_PORT=${{ secrets.SMTP_PORT || '587' }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            EMAIL_FROM_NAME="Eventpatro Sunway"
            CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
            EOF

            echo ">>> [4/5] Building frontend..."
            cd /var/www/eventpatro/client
            npm ci
            npm run build

            echo ">>> [5/5] Restarting PM2 backend service & reloading Nginx..."
            cd /var/www/eventpatro/server
            pm2 startOrRestart ecosystem.config.cjs
            pm2 save
            sudo nginx -t && sudo systemctl reload nginx

            echo ">>> Deployment completed successfully!"
